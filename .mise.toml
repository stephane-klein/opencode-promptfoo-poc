[env]
_.path = './node_modules/.bin'
PROMPTFOO_CONFIG_DIR="{{ cwd }}/.promptfoo/"
PROMPTFOO_CACHE_PATH="{{ cwd }}/.promptfoo/cache/"
PROMPTFOO_LOG_DIR="{{ cwd }}/.promptfoo/logs/"

[tools]
node = "22"
pnpm = "11.1"

[tasks.eval]
description = "Run promptfoo eval with local OpenCode config (reads config/opencode/AGENTS.md)"
env = { XDG_CONFIG_HOME = "{{config_root}}/config" }
run = "promptfoo eval"

[tasks.eval-no-cache]
description = "Run promptfoo eval with no cache and local OpenCode config (reads config/opencode/AGENTS.md)"
env = { XDG_CONFIG_HOME = "{{config_root}}/config" }
run = "promptfoo eval --no-cache"

[tasks.view]
description = "Start promptfoo viewer"
env = { XDG_CONFIG_HOME = "{{config_root}}/config" }
run = "promptfoo view"
